apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-v3
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-90"
spec:
  project: infra
  source:
    chart: traefik
    repoURL: https://traefik.github.io/charts 
    targetRevision: 30.0.2
    helm:
      valuesObject:
        ingressClass:
          name: traefik
        providers:
          kubernetesCRD:
            ingressClass: traefik
          kubernetesIngress:
            ingressClass: traefik
  destination:
    namespace: traefik-v3
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
