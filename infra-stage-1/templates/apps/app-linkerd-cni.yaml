apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkerd-cni
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-90"
spec:
  project: infra
  source:
    chart: linkerd2-cni
    repoURL: https://helm.linkerd.io/edge
    targetRevision: 2024.7.5 
    helm:
      valuesObject:
        privileged: "true"
  destination:
    namespace: linkerd-cni
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
