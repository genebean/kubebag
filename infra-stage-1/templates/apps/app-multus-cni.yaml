apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multus-cni
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-90"
spec:
  project: infra
  source:
    chart: rke2-multus
    repoURL: https://rke2-charts.rancher.io
    targetRevision: v4.0.206 
    helm:
      valuesObject:
        config:
          cni_conf:
            confDir: /etc/cni/net.d
            binDir: /opt/cni/bin
            kubeconfig: /etc/cni/net.d/multus.d/multus.kubeconfig
        rke2-whereabouts:
          fullnameOverride: whereabouts
          enabled: true
          cniConf:
            confDir: /etc/cni/net.d
            binDir: /opt/cni/bin
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
