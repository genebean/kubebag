    datapathMode: netkit
  cni:
    binPath: '/var/opt/cni/bin'
    confPath: '/etc/cni/net.d'
    exclusive: false
  envoy:
    enabled: false
  ipam:
    operator:
      clusterPoolIPv4PodCIDRList: "10.42.0.0/16"
  k8sServiceHost: "127.0.0.1"
  k8sServicePort: 6443
  kubeProxyReplacement: true
  operator:
    replicas: 1
