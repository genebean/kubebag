apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: main
spec:
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: in
        values:
          - "true"
  interfaces:
    - enp1s0
  externalIPs: true
  loadBalancerIPs: true
