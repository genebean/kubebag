apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server-insecure
spec:
  hostnames:
    - argocd2.example.com
  parentRefs:
    - name: argocd-server-gateway
      sectionName: http
      kind: Gateway
  rules:
     - matches:
        - path:
            type: PathPrefix
            value: /
       backendRefs:
        - name: argocd-server
          port: 80
