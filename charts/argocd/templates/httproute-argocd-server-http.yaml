apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server-http
spec:
  hostnames:
    - argocd.k8s.technicalissues.us
  parentRefs:
    - name: argocd-server-gateway
      sectionName: http
      kind: Gateway
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
