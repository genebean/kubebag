apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argocd-server-gateway
spec:
  gatewayClassName: traefik-v3

  # Only Routes from the same namespace are allowed.
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - name: argocd-server-tls
