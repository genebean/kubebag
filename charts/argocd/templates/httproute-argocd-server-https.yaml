apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server-https
spec:
  hostnames:
    - argocd.k8s.technicalissues.us
  parentRefs:
    - name: argocd-server-gateway
      sectionName: https
      kind: Gateway
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
