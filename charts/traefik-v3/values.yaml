traefik:
  autoscaling:
    enabled: true
    maxReplicas: 3
  ingressClass:
    name: traefik-v3
  ingressRoute:
    dashboard:
      enabled: true
  logs:
    access:
      enabled: true
    general:
      level: 'DEBUG'
  providers:
    kubernetesCRD:
      ingressClass: traefik
    kubernetesIngress:
      ingressClass: traefik
