traefik:
  autoscaling:
    enabled: true
    maxReplicas: 3
  ingressClass:
    name: traefik
  ingressRoute:
    dashboard:
      enabled: true
  logs:
    access:
      enabled: true
    fields:
      defaultMode: keep
      names:
        ClientUsername: drop
        StartLocal: keep
        RouterName: keep
        ServiceName: keep
        ServiceURL: keep
        RequestHost: keep
        RequestPort: keep
        RequestMethod: keep
        RequestPath: keep
        RequestProtocol: keep
        RequestScheme: keep
        RequestLine: keep
      headers:
        defaultMode: keep
        names:
          User-Agent: keep
          Authorization: keep
          Content-Type: keep
  providers:
    kubernetesCRD:
      ingressClass: traefik
    kubernetesIngress:
      ingressClass: traefik
