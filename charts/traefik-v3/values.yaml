traefik:
  autoscaling:
    enabled: true
    maxReplicas: 3
  ingressClass:
    name: traefik-v3
  ingressRoute:
    dashboard:
      enabled: true
      matchRule: Host(`traefik.example.com`)
      # Don't do this in prod, use https and auth of some kind
      entryPoints: ["web"]
      # Add custom middlewares : authentication and redirection
      # middlewares:
      #   - name: traefik-dashboard-auth
  logs:
    access:
      enabled: true
    general:
      level: 'DEBUG'
  providers:
    kubernetesCRD:
      ingressClass: traefik-v3
    kubernetesIngress:
      ingressClass: traefik-v3
