apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-httproute
spec:
  hostnames:
    - whoami2.example.com
  parentRefs:
    - name: traefik-gateway
      sectionName: http
      kind: Gateway
  rules:
     - matches:
        - path:
            type: PathPrefix
            value: /
       backendRefs:
        - name: whoami
          port: 80
