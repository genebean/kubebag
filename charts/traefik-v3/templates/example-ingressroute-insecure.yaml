apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: example-ingressroute-insecure
  annotations:
    kubernetes.io/ingress.class: traefik-v3
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`argocd.example.com`)
    kind: Rule
    services:
    - name: argocd-server
      port: 80
  - match: Host(`whoami.example.com`)
    kind: Rule
    services:
    - name: whoami
      port: 80
